# Production on one server (e.g. Oracle Cloud Always Free). Everything runs here;
# Caddy gets an HTTPS certificate for $DOMAIN automatically.
#   cd deploy && cp .env.example .env && nano .env
#   docker compose up -d --build
name: docsign

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgresql://docsign:${POSTGRES_PASSWORD}@postgres:5432/docsign?schema=public
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: docsign
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GOTENBERG_URL: http://gotenberg:3000
      KEYS_DIR: /data/keys
      WORKER_MODE: inline
    volumes:
      - keys:/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_started
      gotenberg:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docsign
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsign"]
      interval: 5s
      retries: 20

  objectstore:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: docsign
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - objectdata:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

  # Virus scanning of uploads. Needs ~1.5 GB RAM. Turn on with:
  #   docker compose --profile scan up -d   (and set CLAMAV_HOST=clamav in .env)
  clamav:
    # The Debian build also runs on ARM servers (Oracle Ampere); clamav/clamav is x86 only
    image: clamav/clamav-debian:stable
    restart: unless-stopped
    profiles: ["scan"]
    volumes:
      - clamdb:/var/lib/clamav

volumes:
  caddy_data:
  caddy_config:
  keys:
  pgdata:
  objectdata:
  clamdb:
