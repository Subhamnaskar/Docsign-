# Render Blueprint: one free web service running the website and the API.
# Render dashboard → New → Blueprint → pick this repository. Fill in the
# values marked sync:false when asked. Full guide: deploy/FREE-NO-CARD.md
services:
  - type: web
    name: docsign
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/billing/plans
    envVars:
      - key: NODE_ENV
        value: production
      - key: CELL_REGION
        value: in
      - key: APP_SECRET
        generateValue: true
      # The app's address (Hostinger DNS: CNAME sign → this Render service)
      - key: APP_URL
        value: https://sign.nuronixai.in
      - key: CORS_ORIGINS
        value: https://sign.nuronixai.in
      # Neon → Connection string (or Supabase → Connect → Session pooler)
      - key: DATABASE_URL
        sync: false
      # Supabase → Storage → S3 connection
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: docsign-documents
      - key: S3_OBJECT_LOCK
        value: "false"
      # Hostinger email (the no-reply@nuronixai.in mailbox)
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: no-reply@nuronixai.in
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: DocSign <no-reply@nuronixai.in>
      - key: SUPPORT_EMAIL
        value: support@nuronixai.in
      # Output of: npm run keys:export -w @docsign/api
      - key: SEAL_KEYS
        sync: false
      - key: PLATFORM_ADMINS
        sync: false
      - key: TSA_URL
        value: http://timestamp.digicert.com
